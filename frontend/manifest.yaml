apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: roboshop
  labels:
    component: frontend
    project: roboshop
    tier: web
data:
    nginx.conf: |
      user nginx;
      worker_processes auto;
      error_log /var/log/nginx/error.log notice;
      pid /run/nginx.pid;

      include /usr/share/nginx/modules/*.conf;

      events {
          worker_connections 1024;
      }

      http {
          log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" '
                            '"$http_user_agent" "$http_x_forwarded_for"';

          access_log  /var/log/nginx/access.log  main;

          sendfile            on;
          tcp_nopush          on;
          keepalive_timeout   65;
          types_hash_max_size 4096;

          include             /etc/nginx/mime.types;
          default_type        application/octet-stream;

          include /etc/nginx/conf.d/*.conf;

          server {
              listen       8080;
              listen       [::]:8080;
              server_name  _;
              root         /usr/share/nginx/html;

              include /etc/nginx/default.d/*.conf;

              error_page 404 /404.html;
              location = /404.html {
              }

              error_page 500 502 503 504 /50x.html;
              location = /50x.html {
              }

              location /images/ {
                expires 5s;
                root   /usr/share/nginx/html;
                try_files $uri /images/placeholder.jpg;
              }
              location /api/catalogue/ { proxy_pass http://catalogue:8080/; }
              location /api/user/ { proxy_pass http://user:8080/; }
              location /api/cart/ { proxy_pass http://cart:8080/; }
              location /api/shipping/ { proxy_pass http://shipping:8080/; }
              location /api/payment/ { proxy_pass http://payment:8080/; }

              location /health {
                stub_status on;
                access_log off;
              }

          }
      }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: roboshop
  # deployment labels are used to identify the deployment and its associated resources
  labels:
    component: frontend
    project: roboshop
    tier: web
spec:
  replicas: 1
  # These are the labels replica sets use to create pods. The replica set will create pods with these labels, and the deployment will manage those pods.
  # This should match pod labels in the template section below, so that the deployment can manage the pods it creates.
  selector:
    matchLabels:
      component: frontend
      project: roboshop
      tier: web
  # This is the pod template that defines the pods that will be created by the deployment. The deployment will create pods with these labels, and the replica set will manage those pods.
  template:
    metadata:
      labels:
        component: frontend
        project: roboshop
        tier: web
    spec:
      imagePullSecrets:
      - name: ecr-creds
      # This is the container that will be created in the pod. The deployment will create pods  
      containers:
      - name: frontend
        image: 641361263136.dkr.ecr.us-east-1.amazonaws.com/frontend:v1
        volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
          items:
            - key: nginx.conf
              path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: roboshop
  # service labels are used to identify the service and its associated resources  
  labels:
    component: frontend
    project: roboshop
    tier: web
spec:
  type: LoadBalancer
  selector:
    component: frontend
    project: roboshop
    tier: web
  ports:
  - protocol: TCP
    port: 80 # Service port, this is the port that other pods will use to access the service
    targetPort: 8080 # container port, this is the port that the container is listening on